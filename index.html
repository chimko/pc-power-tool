<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PC Power Supply & Wattage Calculator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 1rem;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .checkbox-group input {
            width: auto;
        }
        .results-box {
            margin-top: 30px;
            background: #090d16;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .results-box h2 {
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }
        .wattage-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4ade80;
        }
        .recommendation {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Advanced PC Wattage Calculator</h1>
    <p class="subtitle">Granular hardware database featuring U, H, HX, and Desktop series with transient spike safety.</p>

    <!-- Processor Selection -->
    <div class="section-title">1. Processor (CPU)</div>
    <div class="form-group">
        <label for="cpuSelect">Select CPU Series & Model:</label>
        <select id="cpuSelect" onchange="calculatePower()">
            <option value="65">Intel Core i5 (Desktop - 65W TDP)</option>
            <option value="125" selected>Intel Core i7 / i9 (Desktop K/KF Series - 125W+ TDP)</option>
            <option value="28">Intel Core Ultra / Core i7 (U-Series Ultra Low Power - 28W)</option>
            <option value="45">Intel Core i7 / i9 (H-Series High Performance Laptop - 45W)</option>
            <option value="55">Intel Core i9 (HX-Series Enthusiast Mobile - 55W+)</option>
            <option value="65">AMD Ryzen 5 / 7 (Desktop Non-X - 65W TDP)</option>
            <option value="105">AMD Ryzen 7 / 9 (Desktop X/XT Series - 105W+ TDP)</option>
            <option value="15">AMD Ryzen (U-Series Mobile - 15W)</option>
            <option value="54">AMD Ryzen (HS / HX Series High Performance - 54W)</option>
        </select>
    </div>

    <!-- Graphics Card Selection -->
    <div class="section-title">2. Graphics Card (GPU)</div>
    <div class="form-group">
        <label for="gpuSelect">Select GPU Model:</label>
        <select id="gpuSelect" onchange="calculatePower()">
            <option value="200">NVIDIA GeForce RTX 4070 / 5070 Series (~200W)</option>
            <option value="285" selected>NVIDIA GeForce RTX 4080 / 5080 Series (~320W)</option>
            <option value="450">NVIDIA GeForce RTX 4090 / 5090 Enthusiast (~450W+)</option>
            <option value="150">NVIDIA GeForce RTX 4060 / Laptop Variant (~140W)</option>
            <option value="250">AMD Radeon RX 7800 XT / 7900 GRE (~260W)</option>
            <option value="315">AMD Radeon RX 7900 XTX (~355W)</option>
            <option value="0">Integrated Graphics Only (0W)</option>
        </select>
    </div>

    <!-- System Components -->
    <div class="section-title">3. Motherboard, RAM & Storage</div>
    <div class="form-group">
        <label for="baseSystem">System Base Load (Motherboard, Fans, RGB, SSDs, RAM):</label>
        <select id="baseSystem" onchange="calculatePower()">
            <option value="50" selected>Standard Build (1x Motherboard, 2x M.2 NVMe, 32GB RAM, 4 Fans)</option>
            <option value="80">Heavy Enthusiast Build (Extended ATX Board, Water Cooling Pump, 6+ Fans, RGB Hub)</option>
            <option value="30">Minimalist / Mini-ITX Build</option>
        </select>
    </div>

    <!-- Advanced Safety Toggles -->
    <div class="section-title">4. Advanced Safety & Headroom</div>
    <div class="checkbox-group">
        <input type="checkbox" id="transientSpike" checked onchange="calculatePower()">
        <label for="transientSpike">Enable Transient Spike Safety Margin (+25% Headroom for High-End GPUs)</label>
    </div>

    <!-- Results Panel -->
    <div class="results-box">
        <h2>Estimated Power Consumption</h2>
        <div class="wattage-display" id="totalWatts">0 W</div>
        <div class="recommendation" id="psuRecommendation">Recommended PSU: Calculating...</div>
    </div>
</div>

<script>
function calculatePower() {
    const cpuWatts = parseInt(document.getElementById('cpuSelect').value);
    const gpuWatts = parseInt(document.getElementById('gpuSelect').value);
    const baseWatts = parseInt(document.getElementById('baseSystem').value);
    const useTransient = document.getElementById('transientSpike').checked;

    let subtotal = cpuWatts + gpuWatts + baseWatts;
    
    // Apply transient spike cushion if checked (modern high-end GPUs spike significantly)
    if (useTransient && gpuWatts > 150) {
        subtotal *= 1.25; 
    }

    const calculatedWatts = Math.round(subtotal);

    // Find a comfortable PSU tier (rounding up to standard commercial PSU wattage blocks: 500, 650, 750, 850, 1000, 1200, 1500)
    let recommendedPSU = 500;
    const psuTiers = [450, 550, 650, 750, 850, 1000, 1200, 1500];
    
    for (let tier of psuTiers) {
        if (calculatedWatts <= tier - 100) { // Keep a healthy buffer
            recommendedPSU = tier;
            break;
        }
        recommendedPSU = 1500; // Fallback for massive rigs
    }

    document.getElementById('totalWatts').innerText = calculatedWatts + " W";
    document.getElementById('psuRecommendation').innerText = `Recommended Power Supply Unit (PSU): ${recommendedPSU}W (80+ Gold Certified)`;
}

// Run on initial load
calculatePower();
</script>

</body>
</html>
